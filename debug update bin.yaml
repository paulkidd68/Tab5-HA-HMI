alias: Debug Update Bin
sequence:
  - data:
      entity_id: calendar.newark_sherwood_district_council
      start_date_time: "{{ (now() - timedelta(days=1)).isoformat() }}"
      end_date_time: "{{ (now() + timedelta(days=30)).isoformat() }}"
    response_variable: events_resp
    action: calendar.get_events
  - target:
      entity_id: input_text.wc_next_bin
    data:
      value: >-
        {{ {'resp': events_resp, 'attrs':
        states.calendar.newark_sherwood_district_council.attributes} | tojson }}
    action: input_text.set_value
