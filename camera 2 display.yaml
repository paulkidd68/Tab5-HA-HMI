alias: camera 2 display
description: ""
fields: {}
sequence:
  - variables:
      base: http://192.168.0.48:8123
      bust: "{{ now().timestamp() | int }}"
      final_url: "{{ base ~ '/local/slides/nowplaying.png?t=' ~ bust }}"
  - action: camera.snapshot
    data:
      entity_id: camera.swann_mainstream
      filename: /config/www/slides/_incoming.bin
  - delay: "00:00:01"
  - action: shell_command.normalize_image_from_tmp_crop
    data: {}
  - action: shell_command.normalize_image_m5tab
    data: {}
  - action: shell_command.cleanup_incoming
    data: {}
  - delay: "00:00:01"
  - action: system_log.write
    data:
      message: "NowPlaying PNG URL: {{ final_url }}"
      level: info
  - data:
      url: >-
        http://192.168.0.48:8123/local/slides/m5tab_snapshot.bin?t={{
        now().timestamp() | int }}
    action: esphome.tab5_ha_hmi_show_camera_snapshot
  - data:
      message: Car detected
      data:
        group: Home Assistant
        color: "#8ff798"
        icon_url: "{{ final_url }}"
        importance: high
        timeout: 600
        vibrationPattern: 100, 1000, 100, 1000, 100
        notification_icon: mdi:car
    action: notify.mobile_app_sm_s911b
mode: single