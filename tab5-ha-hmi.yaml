script:

  - id: expand_nav_btn_click_area
    # Expand the clickable area for the main navigation buttons so
    # that touches near the icons are also registered. This improves
    # usability of the side navigation rail on small touch targets.
    then:
      - lambda: |-
          std::vector<lv_obj_t*> btns = {
            id(dash_panel_btn),
            id(climate_panel_btn),
            id(light_panel_btn),
            id(weather_panel_btn),
            id(outlets_panel_btn),
            id(burner_panel_btn),
            id(radar_panel_btn)
          };
          for (auto* btn : btns) {
            lv_obj_set_ext_click_area(btn, 180);
          }
  - id: toggle_mute
    # Toggle the speaker enable switch in Home Assistant
    then:
      - homeassistant.service:
          service: switch.toggle
          data:
            entity_id: switch.tab5_hmi_speaker_enable

            
  - id: nav_rail_update
    # Update the navigation rail UI to reflect the current page
    # selection. This sets the checked state on the correct nav button,
    # updates the icon to the active/inactive glyph, and applies the
    # appropriate label style (active/inactive color).
    then:
      - lambda: |-
          const int active = id(page_num);
          lv_obj_t* buttons[] = { 
              id(dash_panel_btn), 
              id(light_panel_btn), 
              id(climate_panel_btn),
              id(weather_panel_btn),
              id(media_panel_btn),
              id(outlets_panel_btn),
              id(burner_panel_btn), 
              id(radar_panel_btn),
          };
          lv_obj_t* icons[] = { 
              id(dash_btn_icon), 
              id(light_btn_icon), 
              id(climate_btn_icon),
              id(weather_btn_icon),
              id(media_btn_icon),
              id(outlets_btn_icon),
              id(burner_btn_icon),
              id(radar_btn_icon),
          };
          lv_obj_t* labels[] = { 
              id(dash_btn_label), 
              id(light_btn_label), 
              id(climate_btn_label), 
              id(weather_btn_label),
              id(media_btn_label),
              id(outlets_btn_label),
              id(burner_btn_label),
              id(radar_btn_label),
          };
          const char* icon_unchecked[] = {
              "\U000F0A1D", // dashboard-outline
              "\U000F0336", // lightbulb-outline
              "\U000F0F55", // thermometer-outline
              "\U000F0590", // weather-cloudy
              "\U000F0333", // music box
              "\U000F07E8", // power-socket-us
              "\U000F0238", // fire-outline
              "\U000F001D", // plane
          };
          const char* icon_checked[] = {
              "\U000F056E", // dashboard
              "\U000F0335", // lightbulb
              "\U000F0F54", // thermometer
              "\U000F1B5A", // mdi:weather-dust 
              "\U000F0333", // music box (same)
              "\U000F07E8", // power-socket-us (same)
              "\U000F1807", // fire-circle
              "\U000F187B", // plane checked
          };

          const int count = sizeof(buttons) / sizeof(buttons[0]);
          
          // Update button UI
          for (int i = 0; i < count; i++) {
              if (i == id(page_num)) {
                lv_obj_add_state(buttons[i], LV_STATE_CHECKED);
              } else {
                lv_obj_clear_state(buttons[i], LV_STATE_CHECKED);
              }
              bool selected = (i == active);
              lv_obj_add_style(labels[i], selected ? id(nav_label_activate) : id(nav_label_inactivate), LV_PART_MAIN);
              lv_label_set_text(icons[i], selected ? icon_checked[i] : icon_unchecked[i]);
          }
          
          // Make sidebar transparent on burner page (page 6)
          if (id(page_num) == 6) {
              lv_obj_set_style_bg_opa(id(sidebars), LV_OPA_TRANSP, LV_PART_MAIN);
          } else {
              lv_obj_set_style_bg_opa(id(sidebars), LV_OPA_COVER, LV_PART_MAIN);
          }

