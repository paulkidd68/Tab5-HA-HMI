          align: CENTER
          id: ac_container
          styles: modal_container
          clickable: true
          hidden: true # default hidden
          on_press:
            - lvgl.widget.hide: ac_container
          widgets:
            - obj:
                styles: card_lg
                widgets:
                  - button:
                      styles: card_lg_icon_btn_transp
                      align: TOP_LEFT
                      widgets:
                        - label:
                            text_color: 0xFFFFFF
                            text_font: extra_icon
                            text: "\U000F0156"
                            align: CENTER
                      on_press:
                        - lvgl.widget.hide: ac_container
                  - arc:
                      align: CENTER
                      id: ac_arc
                      min_value: 180
                      max_value: 320
                      arc_width: 35
                      width: 320
                      height: 320
                      adjustable: true
                      arc_color: 0xEBEBEB
                      knob:
                        pad_all: -2
                        outline_width: 3
                        outline_color: 0xFF9966
                        bg_color: 0xFFFFFF
                      indicator:
                        arc_width: 35
                        arc_color: 0xFF9966
                      # Prevent frequent use of 'on_value'
                      # In case of performance issue
                      on_release:
                        - lambda: |-
                            int mod = int(x) % 5;
                            if ( mod == 0 ) 
                              lv_arc_set_value(id(ac_arc), x);
                            else 
                              lv_arc_set_value(id(ac_arc), x - mod);
                        - lvgl.label.update:
                            id: demo_ac_temp
                            text:
                              format: "%.1f °C"
                              args: [ 'float(lv_arc_get_value(id(ac_arc))) / 10.0f' ]
                        - lambda: |-
                            float temp = float(lv_arc_get_value(id(ac_arc))) / 10.0f;
                            if (id(selected_climate) == 0) {
                              lv_spinbox_set_value(id(temp_spin_box), temp * 10);
                              id(set_ac_temp)->execute(temp);
                            } else {
                              lv_spinbox_set_value(id(temp_spin_box_2), temp * 10);
                              id(set_ac2_temp)->execute(temp);
