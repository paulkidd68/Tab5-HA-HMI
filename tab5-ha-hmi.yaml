            my_r: !lambda "return (int)id(light_r);"
            my_g: !lambda "return (int)id(light_g);"
            my_b: !lambda "return (int)id(light_b);"
          data:
            entity_id: light.h618a_e46e
          data_template:
            rgb_color: "{{ [my_r, my_g, my_b] }}"
            
            

