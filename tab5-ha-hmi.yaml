# Tab5 Home assistant dashboard for Tab5 Version 1
# Based around the M5Stack Tab% Home assistant demo code that has now been removed.
# Modified by P.Kiddier 2026 for use as a Home Assistant dashboard and general HMI

substitutions:
  name: "tab5-ha-hmi"
  default_low: "7"
  default_hi: "20"
  room: Workshop
  entity_heater: input_boolean.cabinet_heater
  entity_heater_2: climate.afterburner_afterburner2_climate_device
  entity_media_player: media_player.workshop
  entity_govee_light: light.h618a_e46e
  entity_light_area_2: switch.tasmota_main_lights
  entity_light_area_3: switch.tasmota
  entity_weather: weather.forecast_home  
  cycle_interval_ms: "15000"    # 15s between screens
  cycle_pause_ms: "30000"       # 30s pause after user action

esphome:
  name: "${name}"
  friendly_name: M5Stack Tab5 Home Assistant HMI
  build_flags: "-DBOARD_HAS_PSRAM"
#  board_build.esp-idf.memory_type: qio_opi
#  board_build.flash_mode: dio
#  board_upload.maximum_ram_size: 524288
#  board_build.flash_size: 16MB  
  on_boot:
    then:
    - rx8130.read_time:
        id: rx8130_time      
      # Power rails on (important on Tab5)
    - switch.turn_on: usb_5v_power
    - switch.turn_on: external_5v_power
    - switch.turn_on: wifi_power
    - switch.turn_on: speaker_enable
    - light.turn_on:
        id: backlight
        brightness: 100%
      # Route ES8388 DAC to speaker path
    - select.set:
        id: tab5_dac_out
        option: LINE1
      # Show splash overlay
    - lvgl.widget.show: splash_overlay
      # Start on Dashboard (behind splash)
    - lvgl.page.show:
        id: dashboard_page
        animation: NONE
        time: 0ms


esp32:
  board: m5stack-tab5-p4
  variant: esp32p4
  flash_size: 16MB
  cpu_frequency: 360MHz
  framework:
    type: esp-idf
    components: espressif/m5stack_tab5^1.2.0~1
    sdkconfig_options:
      # PSRAM configuration
      CONFIG_FREERTOS_HZ=1000: "y"
      CONFIG_ESP_VIDEO_ENABLE_ISP_PIPELINE_CONTROLLER: "y"
      CONFIG_SPIRAM: "y"
      CONFIG_SPIRAM_SPEED_200M: "y"
      # Move read-only data and instructions to PSRAM to free internal RAM
      CONFIG_SPIRAM_RODATA: "y"
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: "y"
      # TLS buffers in PSRAM (helps with API/WiFi connections)
      CONFIG_MBEDTLS_EXTERNAL_MEM_ALLOC: "y"
      CONFIG_MBEDTLS_SSL_PROTO_TLS1_3: "y"



esp32_hosted:
  variant: esp32c6
  active_high: true
  clk_pin: GPIO12
  cmd_pin: GPIO13
  d0_pin: GPIO11
  d1_pin: GPIO10
  d2_pin: GPIO9
  d3_pin: GPIO8
  reset_pin: GPIO15
  slot: 1

logger:
  hardware_uart: USB_SERIAL_JTAG
  level: INFO
  # Per-component log levels for production optimization
  # Set to DEBUG for troubleshooting specific components
  logs:
    component: ERROR      # Reduce component lifecycle noise
    api.connection: WARN   # Only show API connection issues
    wifi: WARN             # Only show WiFi issues
    sensor: WARN           # Reduce sensor update noise
    lvgl: WARN             # Reduce LVGL noise
    # Uncomment below to debug specific areas:
    # album_art: DEBUG
    # media: DEBUG

psram:
  mode: hex
  speed: 200MHz

api:
  max_connections: 8
  encryption:
    key: !secret tab5_api_encryption_key
  on_client_connected: 
    then:
      - lvgl.widget.show: api_icon_label
  on_client_disconnected: 
    then:
      - lvgl.widget.hide: api_icon_label

ota:
  platform: esphome
  password: !secret tab5_ota_password

safe_mode:

captive_portal:

web_server:
  port: 80
  auth:
    type: digest
    username: !secret tab5_web_server_username
    password: !secret tab5_web_server_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: true
  reboot_timeout: 15min  # Auto-reboot if WiFi fails for 15 minutes
  ap:
    ssid: "Tab5-HMI-Fallback"
    password: !secret tab5_ap_password 
  on_connect: 
    then:
      - lvgl.widget.show: wifi_icon_label
  on_disconnect: 
    then:
      - lvgl.widget.hide: wifi_icon_label

# Required for online_image component
http_request:
  verify_ssl: false
  timeout: 10s      

# Album art image fetcher
image:
  - platform: online_image
    id: album_art_image_jpg
    url: "https://via.placeholder.com/180"
    format: JPG
    type: RGB565
    resize: 240x240
    byte_order: LITTLE_ENDIAN
    on_download_finished:
      - lvgl.image.update:
          id: album_art_img_widget
          src: album_art_image_jpg
      - lvgl.widget.show: album_art_img_widget
      - lvgl.widget.hide: media_default_icon
    on_error:
      - lvgl.widget.hide: album_art_img_widget
      - lvgl.widget.show: media_default_icon

  - platform: online_image
    id: album_art_image_png
    url: "https://via.placeholder.com/180"
    format: PNG
    type: RGB565
    resize: 240x240
    byte_order: LITTLE_ENDIAN
    on_download_finished:
      - lvgl.image.update:
          id: album_art_img_widget
          src: album_art_image_png
      - lvgl.widget.show: album_art_img_widget
      - lvgl.widget.hide: media_default_icon
    on_error:
      - lambda: |-
          ESP_LOGW("album_art", "Failed to download PNG album art");
      - lvgl.widget.hide: album_art_img_widget
      - lvgl.widget.show: media_default_icon


  - platform: file
    id: youtube_logo
    file: "logos/youtube.png"
    type: RGB565
    resize: 240x240
    byte_order: little_endian
    
  - platform: file
    id: disney_logo
    file: "logos/disney.png"
    type: RGB565
    resize: 240x240
    byte_order: little_endian
    
  - platform: file
    id: prime_logo
    file: "logos/amazon.png"
    type: RGB565
    resize: 240x240
    byte_order: little_endian
    
  - platform: file
    id: appletv_logo
    file: "logos/appletv.png"
    type: RGB565
    resize: 240x240 
    byte_order: little_endian

  - platform: file
    id: netflix_logo
    file: "logos/netflix_logo.png"
    type: RGB565
    resize: 240x240
    byte_order: little_endian  

  - platform: file
    id: heater_bg
    file: "images/heater.jpg"
    type: RGB565
    resize: 1280x720
    byte_order: little_endian

i2c:
  - id: bsp_bus
    sda: GPIO31
    scl: GPIO32
    frequency: 400kHz
  - id: port_a_bus
    sda: GPIO53         # Port A SDA
    scl: GPIO54         # Port A SCL
    frequency: 100kHz
    scan: true

pi4ioe5v6408:
  - id: pi4ioe1
    i2c_id: bsp_bus
    address: 0x43
    # 0: O - wifi_antenna_int_ext
    # 1: O - speaker_enable
    # 2: O - external_5v_power
    # 3: NC
    # 4: O - lcd reset
    # 5: O - touch panel reset
    # 7: I - headphone detect
  - id: pi4ioe2
    i2c_id: bsp_bus
    address: 0x44
    # 0: O - wifi_power
    # 1: NC
    # 2: NC
    # 3: O - usb_5v_power
    # 4: O - poweroff pulse
    # 5: O - quick charge enable (inverted)
    # 6: I - charging status
    # 7: O - charge enable

switch:
  - platform: gpio
    id: wifi_power
    name: "WiFi Power"
    internal: true  # System power rail - don't expose to HA
    pin:
      pi4ioe5v6408: pi4ioe2
      number: 0
    restore_mode: ALWAYS_ON
  - platform: gpio
    id: usb_5v_power
    name: "USB Power"
    internal: true  # System power rail - don't expose to HA
    pin:
      pi4ioe5v6408: pi4ioe2
      number: 3
  - platform: gpio
    id: wifi_antenna_int_ext
    internal: true  # Internal antenna switch
    pin:
      pi4ioe5v6408: pi4ioe1
      number: 0
  - platform: gpio
    id: speaker_enable
    name: "Speaker Enable"
    internal: true  # System power rail - don't expose to HA
    pin:
      pi4ioe5v6408: pi4ioe1
      number: 1
    restore_mode: ALWAYS_ON
  - platform: gpio
    id: external_5v_power
    entity_category: diagnostic  # Show in diagnostics, not main controls
    name: "External 5V Power"
    pin:
      pi4ioe5v6408: pi4ioe1
      number: 2

  - platform: template
    name: Antiburn
    id: switch_antiburn
    icon: mdi:television-shimmer
    optimistic: true
    entity_category: "config"
    turn_on_action:
      - logger.log: "Starting Antiburn"
      - if:
          condition: lvgl.is_paused
          then:
            - lvgl.resume:
            - lvgl.widget.redraw:
      - lvgl.pause:
          show_snow: true
    turn_off_action:
      - logger.log: "Stopping Antiburn"
      - if:
          condition: lvgl.is_paused
          then:
            - lvgl.resume:
            - lvgl.widget.redraw:
            - light.turn_off: backlight  



binary_sensor:

  - platform: gpio
    id: headphone_detect
    name: "Headphone Detect"
    pin:
      pi4ioe5v6408: pi4ioe1
      number: 7


  - platform: status
    id: status_sensor
    name: Status sensor

  - platform: template
    id: fire

select:
# The DAC Output select needs to be manually 
# (or with an automation) changed to `LINE1` for the onboard speaker
  - platform: es8388
    dac_output:
      id: tab5_dac_out
      name: DAC Output
    adc_input_mic:
      name: ADC Input Mic

  - platform: template
    id: wifi_antenna_select
    name: "WiFi Antenna"
    options:
      - "Internal"
      - "External"
    optimistic: true
    on_value:
      - if:
          condition:
            lambda: return i == 0;
          then:
            - switch.turn_off: wifi_antenna_int_ext
          else:
            - switch.turn_on: wifi_antenna_int_ext

sensor:

  # --- ENV III on Tab5 I2C ---
  - platform: sht3xd
    i2c_id: port_a_bus
    address: 0x44
    update_interval: 120s
    temperature:
      id: internal_temperature
      name: "Workshop Temp (ENV III)"
      on_value:
        then:
          - lvgl.label.update:
              id: temp_label
              text: !lambda |-
                char buf[32];
                snprintf(buf, sizeof(buf), "%.1f °C", x);
                return std::string(buf);
    humidity:
      id: internal_humidity
      name: "Workshop Humidity (ENV III)"
      on_value:
        then:
          - lvgl.label.update:
              id: humi_label
              text: !lambda |-
                char buf[32];
                snprintf(buf, sizeof(buf), "%.0f %%", x);
                return std::string(buf);

  # --- WiFi Signal Strength ---
  - platform: wifi_signal
    id: wifi_rssi
    name: "${name} WiFi Signal"
    entity_category: diagnostic
    update_interval: 30s
    on_value:
      then:
        - lvgl.label.update:
            id: wifi_icon_label
            text_color: !lambda |-
              int rssi = (int)x;
              if (rssi >= -50) return lv_color_hex(0x00FF00);       // Green - Excellent
              else if (rssi >= -60) return lv_color_hex(0x7FFF00);  // Yellow-Green - Good
              else if (rssi >= -70) return lv_color_hex(0xFFCC00);  // Yellow - Fair
              else return lv_color_hex(0xFF6600);                   // Orange - Weak

  - platform: uptime
    name: "${name} Uptime"
    entity_category: diagnostic

  - platform: qmp6988
    i2c_id: port_a_bus
    address: 0x70
    update_interval: 120s
    pressure:
      id: room_pressure
      name: "Workshop Pressure (ENV III)"

  # Afterburner sensors
  - platform: homeassistant
    id: afterburner_pump_speed
    entity_id: sensor.afterburner_afterburner2_actual_pump_speed
    internal: true
    on_value:
      then:
        - lvgl.label.update:
            id: pump_speed_value
            text: !lambda |-
              char buf[32];
              snprintf(buf, sizeof(buf), "%.1f", x);
              return std::string(buf);

  - platform: homeassistant
    id: afterburner_fan_speed
    entity_id: sensor.afterburner_afterburner2_fan_speed
    internal: true
    on_value:
      then:
        - lvgl.label.update:
            id: fan_speed_value
            text: !lambda |-
              char buf[32];
              snprintf(buf, sizeof(buf), "%.0f", x);
              return std::string(buf);

  - platform: homeassistant
    id: afterburner_fuel_rate
    entity_id: sensor.afterburner_afterburner2_fuel_rate
    internal: true
    on_value:
      then:
        - lvgl.label.update:
            id: fuel_rate_value
            text: !lambda |-
              char buf[32];
              snprintf(buf, sizeof(buf), "%.2f", x);
              return std::string(buf);

  - platform: homeassistant
    id: afterburner_glow_current
    entity_id: sensor.afterburner_afterburner2_glow_plug_current
    internal: true
    on_value:
      then:
        - lvgl.label.update:
            id: glow_current_value
            text: !lambda |-
              char buf[32];
              snprintf(buf, sizeof(buf), "%.2f A", x);
              return std::string(buf);

  - platform: homeassistant
    id: afterburner_temperature
    entity_id: sensor.afterburner_afterburner2_heater_temperature
    internal: true
    on_value:
      then:
        - lvgl.label.update:
            id: heater_temp_value
            text: !lambda |-
              char buf[32];
              snprintf(buf, sizeof(buf), "%.0f °C", x);
              return std::string(buf);


  
touchscreen:
  - platform: gt911
    i2c_id: bsp_bus
    interrupt_pin: GPIO23
    update_interval: never
    reset_pin:
      pi4ioe5v6408: pi4ioe1
      number: 5
    id: touch
    on_release:
      - if:
          condition: lvgl.is_paused
          then:
            - logger.log: "LVGL resuming"
            - lvgl.resume:
            - lvgl.widget.redraw:
            - light.turn_on: backlight
            - script.execute: refresh_time_labels
      
esp_ldo:
  - voltage: 2.5V
    channel: 3

display:
  - platform: mipi_dsi
    dimensions:
      height: 1280
      width: 720
    model: M5Stack-Tab5
    reset_pin:
      pi4ioe5v6408: pi4ioe1
      number: 4

output:
  - platform: ledc
    pin: GPIO22
    id: backlight_pwm
    frequency: 1000Hz

light:
  - platform: monochromatic
    output: backlight_pwm
    name: "Display Backlight"
    id: backlight
    restore_mode: RESTORE_DEFAULT_OFF
    default_transition_length: 250ms
    on_turn_off:
      - lvgl.pause:
          show_snow: false
    on_turn_on:
      - if:
          condition: lvgl.is_paused
          then:
            - lvgl.resume:
            - lvgl.widget.redraw:

i2s_audio:
  - id: mic_bus
    i2s_lrclk_pin: GPIO29
    i2s_bclk_pin: GPIO27
    i2s_mclk_pin: GPIO30

audio_adc:
  - platform: es7210
    i2c_id: bsp_bus
    id: es7210_adc
    bits_per_sample: 16bit
    sample_rate: 16000

microphone:
  - platform: i2s_audio
    id: tab5_microphone
    i2s_din_pin: GPIO28
    sample_rate: 16000
    bits_per_sample: 16bit
    adc_type: external

audio_dac:
  - platform: es8388
    i2c_id: bsp_bus
    id: es8388_dac

speaker:
  - platform: i2s_audio
    id: tab5_speaker
    i2s_dout_pin: GPIO26
    audio_dac: es8388_dac
    dac_type: external
    channel: mono
    buffer_duration: 100ms
    bits_per_sample: 16bit
    sample_rate: 48000

media_player:
  - platform: speaker
    name: tab5_media_player
    id: speaker_player
    announcement_pipeline:
      speaker: tab5_speaker
      format: FLAC
      sample_rate: 48000
      num_channels: 1
    files:
    - id: heat
      file: The_Heat_Is_On.flac
    - id: cold
      file: Frosty_The_Snowman.flac
    

time:
  - platform: homeassistant
    id: ha_time
    on_time_sync:
      then:
        rx8130.write_time:
  - platform: rx8130
    id: rx8130_time
    timezone: Europe/London
    i2c_id: bsp_bus
    update_interval: never
    on_time:
      # Update once ready
      - seconds: /3
        then:
          - lvgl.label.update:
              id: time_label
              text: !lambda |-
                auto t = id(ha_time).now();
                return t.strftime("%H:%M").c_str();

          - lvgl.label.update:
              id: date_label
              text: !lambda |-
                auto t = id(ha_time).now();
                return t.strftime("%a %d %b %Y").c_str();

          - if:
              condition:
                lambda: 'return id(page_num) == 7;'
              then:
                - lvgl.label.update:
                    id: radar_last_update_value
                    text: !lambda |-
                      auto t = id(ha_time).now();
                      return t.strftime("%H:%M:%S").c_str();

      - hours: 2,3,4,5
        minutes: 5
        seconds: 0
        then:
          - switch.turn_on: switch_antiburn
      - hours: 2,3,4,5
        minutes: 35
        seconds: 0
        then:
          - switch.turn_off: switch_antiburn   

climate:
  - platform: thermostat
    min_heating_off_time: 900s
    min_heating_run_time: 600s
    min_idle_time: 300s
    visual:
      min_temperature: 5 °C
      max_temperature: 24 °C
      temperature_step: 1
    name: "${room} Thermostat"
    id: this_thermostat
    sensor: internal_temperature
    default_preset: Home
    on_boot_restore_from: default_preset
    preset:
      - name: Home
        default_target_temperature_low: ${default_low}
        mode: HEAT
    heat_action:
      - lambda: id(fire).publish_state(true);
      - homeassistant.service:
          service: switch.turn_on
          data:
            entity_id: ${entity_heater}
#      - script.execute: heat_on_sound
    idle_action:
      - lambda: id(fire).publish_state(false);
      - homeassistant.service:
          service: switch.turn_off
          data:
            entity_id: ${entity_heater}
#      - script.execute: heat_off_sound



text_sensor:   
  # Apple TV Media Player State
  - platform: homeassistant
    id: media_player_state
    entity_id: ${entity_media_player}
    internal: true
    on_value:
      then:
        - lvgl.label.update:
            id: media_state_label
            text: !lambda |-
              std::string state = x;
              // Capitalize first letter
              if (!state.empty()) state[0] = toupper(state[0]);
              return state;
        - lvgl.label.update:
            id: media_play_icon
            text: !lambda |-
              if (x == "playing") return "\U000F03E4";  // pause icon
              return "\U000F040A";  // play icon
        - lvgl.widget.update:
            id: media_play_btn
            bg_color: !lambda |-
              if (x == "playing") return lv_color_hex(0xFFAA00);
              return lv_color_hex(0x00AA00);
        # Handle off/unavailable states - show power off icon and hide labels
        - if:
            condition:
              lambda: 'return x == "off" || x == "standby" || x == "unavailable";'
            then:
              # Show power-off icon
              - lvgl.widget.hide: album_art_img_widget
              - lvgl.widget.show: media_default_icon
              - lvgl.label.update:
                  id: media_default_icon
                  text_font: extra_icon
                  text: "\U000F0425"  # power-off icon
                  text_color: 0x666666  # Gray for off state
              # Hide title and artist
              - lvgl.label.update:
                  id: media_title_label
                  text: ""
              - lvgl.label.update:
                  id: media_artist_label
                  text: ""

  - platform: homeassistant
    id: media_player_title
    entity_id: ${entity_media_player}
    attribute: media_title
    internal: true
    on_value:
      then:
        - lvgl.label.update:
            id: media_title_label
            text: !lambda |-
              std::string state = id(media_player_state).state;
              std::string app = id(media_player_app).state;
              std::string app_lower = app;
              for (auto& c : app_lower) c = tolower(c);
              std::string label_text;
              if (state == "off" || state == "standby" || state == "unavailable") {
                if (app_lower.find("youtube") != std::string::npos && !(x.empty() || x == "None" || x == "unknown" || x == "unavailable")) {
                  label_text = x;
                } else {
                  label_text = "Not Playing";
                }
              } else if (x.empty() || x == "None" || x == "unknown" || x == "unavailable") {
                label_text = "Not Playing";
              } else {
                label_text = x;
              }
              return label_text;


  - platform: homeassistant
    id: media_player_artist
    entity_id: ${entity_media_player}
    attribute: media_artist
    internal: true
    on_value:
      then:
        - lvgl.label.update:
            id: media_artist_label
            text: !lambda |-
              // Don't show artist if player is off/standby
              std::string state = id(media_player_state).state;
              if (state == "off" || state == "standby" || state == "unavailable") {
                return std::string("");
              }
              if (x.empty() || x == "None" || x == "unknown" || x == "unavailable") 
                return std::string("Apple TV");
              return x;

  - platform: homeassistant
    id: media_player_app
    entity_id: ${entity_media_player}
    attribute: app_name
    internal: true
    on_value:
      then:
        # Skip processing only when player is truly off/unavailable
        - if:
            condition:
              lambda: |-
                std::string state = id(media_player_state).state;
                return state == "off" || state == "standby" || state == "unavailable";
            then:
              - lambda: 'ESP_LOGD("media", "Player is off, skipping app update");'
            else:
              - if:
                  condition:
                    lambda: 'return id(media_player_artist).state.empty() || id(media_player_artist).state == "None";'
                  then:
                    - lvgl.label.update:
                        id: media_artist_label
                        text: !lambda |-
                          if (x.empty() || x == "None" || x == "unknown" || x == "unavailable") 
                            return std::string("Apple TV");
                          return x;
              # Check app and show appropriate logo for video apps (logos embedded in firmware)
              - lambda: |-
                  std::string app = x;
                  std::string app_lower = x;
                  for (auto& c : app_lower) c = tolower(c);
                  
                  // List of music apps that should show album art (not logo)
                  bool is_music_app = (
                    app_lower.find("music") != std::string::npos ||
                    app_lower.find("spotify") != std::string::npos ||
                    app_lower.find("pandora") != std::string::npos ||
                    app_lower.find("tidal") != std::string::npos ||
                    app_lower.find("deezer") != std::string::npos ||
                    app_lower.find("soundcloud") != std::string::npos
                  );
                  
                  // For music apps, let the entity_picture handler deal with album art
                  if (is_music_app) {
                    return;
                  }
                  
                  // Show the appropriate streaming service logo (stored in firmware)
                  
                  if (app_lower.find("youtube") != std::string::npos) {
                    lv_img_set_src(id(album_art_img_widget), id(youtube_logo));
                    lv_obj_clear_flag(id(album_art_img_widget), LV_OBJ_FLAG_HIDDEN);
                    lv_obj_add_flag(id(media_default_icon), LV_OBJ_FLAG_HIDDEN);
                  } else if (app_lower.find("disney") != std::string::npos) {
                    lv_img_set_src(id(album_art_img_widget), id(disney_logo));
                    lv_obj_clear_flag(id(album_art_img_widget), LV_OBJ_FLAG_HIDDEN);
                    lv_obj_add_flag(id(media_default_icon), LV_OBJ_FLAG_HIDDEN);
                  } else if (app_lower.find("prime") != std::string::npos || app_lower.find("amazon") != std::string::npos) {
                    lv_img_set_src(id(album_art_img_widget), id(prime_logo));
                    lv_obj_clear_flag(id(album_art_img_widget), LV_OBJ_FLAG_HIDDEN);
                    lv_obj_add_flag(id(media_default_icon), LV_OBJ_FLAG_HIDDEN);
                  } else if (app_lower.find("apple tv") != std::string::npos || 
                             app_lower.find("tv app") != std::string::npos ||
                             app_lower.find("tv+") != std::string::npos) {
                    lv_img_set_src(id(album_art_img_widget), id(appletv_logo));
                    lv_obj_clear_flag(id(album_art_img_widget), LV_OBJ_FLAG_HIDDEN);
                    lv_obj_add_flag(id(media_default_icon), LV_OBJ_FLAG_HIDDEN);
                  } else {
                    // Unknown video app - show default icon
                    lv_obj_add_flag(id(album_art_img_widget), LV_OBJ_FLAG_HIDDEN);
                    lv_obj_clear_flag(id(media_default_icon), LV_OBJ_FLAG_HIDDEN);
                  }
              # Update default icon based on app (fallback if logo image fails to load)
              - lvgl.label.update:
                  id: media_default_icon
                  text: !lambda |-
                    std::string app = x;
                    // Convert to lowercase for comparison
                    for (auto& c : app) c = tolower(c);
                    
                    if (app.find("youtube") != std::string::npos) {
                      return "\U000F05C3";  // YouTube icon
                    } else if (app.find("disney") != std::string::npos) {
                      return "\U000F0FC6";  // Movie/filmstrip icon for Disney+
                    } else if (app.find("prime") != std::string::npos || app.find("amazon") != std::string::npos) {
                      return "\U000F0FC6";  // Movie/filmstrip icon for Prime
                    } else if (app.find("apple tv") != std::string::npos || app.find("tv app") != std::string::npos) {
                      return "\U000F075A";  // Apple TV icon
                    } else if (app.find("music") != std::string::npos ||
                               app.find("spotify") != std::string::npos ||
                               app.find("apple music") != std::string::npos) {
                      return "\U000F075B";  // Music icon
                    }
                    return "\U000F075A";  // Default Apple TV icon
                  text_color: !lambda |-
                    std::string app = x;
                    for (auto& c : app) c = tolower(c);
                    
                    if (app.find("youtube") != std::string::npos) {
                      return lv_color_hex(0xFF0000);  // YouTube red
                    } else if (app.find("disney") != std::string::npos) {
                      return lv_color_hex(0x113CCF);  // Disney+ blue
                    } else if (app.find("prime") != std::string::npos || app.find("amazon") != std::string::npos) {
                      return lv_color_hex(0x00A8E1);  // Prime Video blue
                    } else if (app.find("spotify") != std::string::npos) {
                      return lv_color_hex(0x1DB954);  // Spotify green
                    }
                    return lv_color_hex(0x555555);  // Default gray

  - platform: homeassistant
    id: media_player_content_type
    entity_id: ${entity_media_player}
    attribute: media_content_type
    internal: true
    on_value:
      then:
        # Update icon based on content type if app didn't set a specific one
        - lvgl.label.update:
            id: media_default_icon
            text: !lambda |-
              std::string content = x;
              std::string app = id(media_player_app).state;
              for (auto& c : content) c = tolower(c);
              for (auto& c : app) c = tolower(c);
              
              // If app already set a specific icon, keep it
              if (app.find("youtube") != std::string::npos ||
                  app.find("netflix") != std::string::npos ||
                  app.find("spotify") != std::string::npos) {
                // Return current icon (app-based icons take priority)
                if (app.find("youtube") != std::string::npos) return "\U000F05C3";
                if (app.find("netflix") != std::string::npos) return "\U000F08B2";
                if (app.find("spotify") != std::string::npos) return "\U000F075B";
              }
              
              // Set icon based on content type
              if (content.find("video") != std::string::npos ||
                  content.find("movie") != std::string::npos ||
                  content.find("tvshow") != std::string::npos) {
                return "\U000F0FC6";  // Movie icon
              } else if (content.find("music") != std::string::npos ||
                         content.find("audio") != std::string::npos) {
                return "\U000F075B";  // Music icon
              }
              return "\U000F075A";  // Default Apple TV icon

  - platform: homeassistant
    id: media_player_picture
    entity_id: ${entity_media_player}
    attribute: entity_picture
    internal: true
    on_value:
      then:
            - lambda: |-
                if (x.empty() || x == "None" || x == "unknown" || x == "unavailable") {
                  ESP_LOGD("album_art", "No album art available");
                  // Show default icon
                  lv_obj_add_flag(id(album_art_img_widget), LV_OBJ_FLAG_HIDDEN);
                  lv_obj_clear_flag(id(media_default_icon), LV_OBJ_FLAG_HIDDEN);
                  return;
                }
                // Build full URL
                std::string full_url = x;
                if (x[0] == '/') {
                  // Relative URL - prepend HA base URL
                  full_url = "http://homeassistant.local:8123" + x;
                }
                // Handle Apple Music templated URLs with {w}x{h}bb.{f} placeholders
                // Replace {w} with 240, {h} with 240, {f} with jpg
                size_t pos;
                while ((pos = full_url.find("{w}")) != std::string::npos) {
                  full_url.replace(pos, 3, "240");
                }
                while ((pos = full_url.find("{h}")) != std::string::npos) {
                  full_url.replace(pos, 3, "240");
                }
                while ((pos = full_url.find("{f}")) != std::string::npos) {
                  full_url.replace(pos, 3, "jpg");
                }
                while ((pos = full_url.find("{c}")) != std::string::npos) {
                  full_url.replace(pos, 3, "");
                }
                // Diagnostic: test HTTP access to the URL
                #include "esp_http_client.h"
                esp_http_client_config_t config = {};
                config.url = full_url.c_str();
                config.timeout_ms = 10000;
                esp_http_client_handle_t client = esp_http_client_init(&config);
                esp_err_t open_result = esp_http_client_open(client, 0);
                if (open_result == ESP_OK) {
                  int content_length = esp_http_client_fetch_headers(client);
                  char* content_type = nullptr;
                  esp_err_t ct_result = esp_http_client_get_header(client, "Content-Type", &content_type);
                  if (content_length > 0) {
                    // Read first 16 bytes for header analysis
                    char header_bytes[16] = {0};
                    int read_len = esp_http_client_read(client, header_bytes, 16);
                    // Warn if image size is not 240x240
                    if (content_length != 240*240*2 && content_length != 240*240*3) {
                      ESP_LOGW("album_art", "Image size is not 240x240, may cause display issues");
                    }
                        // Detect format: PNG or JPG
                        bool is_png = (header_bytes[0] == (char)0x89 && header_bytes[1] == 'P' && header_bytes[2] == 'N' && header_bytes[3] == 'G');
                        bool is_jpg = (header_bytes[0] == (char)0xFF && header_bytes[1] == (char)0xD8);
                        if (is_png) {
                          id(album_art_image_png).set_url(full_url);
                          esp_http_client_cleanup(client);
                          id(album_art_image_png).update();
                          return;
                        } else if (is_jpg) {
                          id(album_art_image_jpg).set_url(full_url);
                          esp_http_client_cleanup(client);
                          id(album_art_image_jpg).update();
                          return;
                        } else {
                          id(album_art_image_jpg).set_url(full_url);
                          esp_http_client_cleanup(client);
                          id(album_art_image_jpg).update();
                          return;
                        }
                  } else {
                    ESP_LOGW("album_art", "HTTP response has no content");
                  }
                } else {
                  ESP_LOGE("album_art", "HTTP open failed for URL: %s", full_url.c_str());
                }
                esp_http_client_cleanup(client);
                // Fallback: show default icon
                lv_obj_add_flag(id(album_art_img_widget), LV_OBJ_FLAG_HIDDEN);
                lv_obj_clear_flag(id(media_default_icon), LV_OBJ_FLAG_HIDDEN);

              
