          // Helper to format float with fallback
          auto fmt_float = [](const std::string &val, const char* fmt, const char* fallback) -> std::string {
            if (val.empty() || val == "unknown" || val == "unavailable" || val == "None" || val == "null") 
              return std::string(fallback);
            float v = atof(val.c_str());
            char buf[48];
            snprintf(buf, sizeof(buf), fmt, v);
            return std::string(buf);
          };
          
          // Forecast labels
          auto fc_temp_val = id(fc_temperature).state;
          lv_label_set_text(id(lbl_fc_temp), fmt_float(fc_temp_val, "%.1f °C", "--.- °C").c_str());
          
