  # --- Waste collection (individual sensors for each bin type) ---
  - platform: homeassistant
    id: wc_general
    entity_id: sensor.waste_collection_schedule_general
    internal: true
    on_value:
      then:
        - lambda: |-
            ESP_LOGD("wc_general", "Received: '%s'", x.c_str());
            std::string data = x;
            
            // Parse pipe-separated format: types|daysTo|DD.MM.YYYY|dayOfWeek
            size_t first_pipe = data.find('|');
            if (first_pipe == std::string::npos) {
              ESP_LOGW("wc_general", "No pipe separator found");
              lv_label_set_text(id(wc_bin_icon_1), "");
              lv_label_set_text(id(wc_bin_date_1), "");
              lv_label_set_text(id(wc_bin_day_1), "");
              return;
            }
            
            size_t second_pipe = data.find('|', first_pipe + 1);
            if (second_pipe == std::string::npos) {
              ESP_LOGW("wc_general", "Second pipe separator not found");
              lv_label_set_text(id(wc_bin_icon_1), "");
              lv_label_set_text(id(wc_bin_date_1), "");
              lv_label_set_text(id(wc_bin_day_1), "");
              return;
            }
            
            size_t third_pipe = data.find('|', second_pipe + 1);
            size_t date_end = (third_pipe != std::string::npos) ? third_pipe : data.length();
            std::string date_str = data.substr(second_pipe + 1, date_end - second_pipe - 1);
            
            // Trim whitespace
            size_t start = date_str.find_first_not_of(" \t\r\n");
            size_t end = date_str.find_last_not_of(" \t\r\n");
            if (start != std::string::npos && end != std::string::npos) {
              date_str = date_str.substr(start, end - start + 1);
            }
            
            ESP_LOGD("wc_general", "Parsed date: '%s' (len=%d)", date_str.c_str(), date_str.length());
            
            // Validate DD.MM.YYYY format (dots at positions [2] and [5])
            if (!date_str.empty() && date_str.length() >= 10 && 
                date_str[2] == '.' && date_str[5] == '.') {
              lv_label_set_text(id(wc_bin_icon_1), "\U000F0A7A");
              lv_obj_set_style_text_color(id(wc_bin_icon_1), lv_color_hex(0x4CAF50), LV_PART_MAIN);
              lv_label_set_text(id(wc_bin_date_1), date_str.c_str());
              
              int day = atoi(date_str.substr(0, 2).c_str());
              int month = atoi(date_str.substr(3, 2).c_str());
              int year = atoi(date_str.substr(6, 4).c_str());
              
              if (year > 1900 && month >= 1 && month <= 12 && day >= 1 && day <= 31) {
                if (month < 3) { month += 12; year--; }
                int dow = (day + (13 * (month + 1)) / 5 + year + year / 4 - year / 100 + year / 400) % 7;
                const char* days[] = {"Sat", "Sun", "Mon", "Tue", "Wed", "Thu", "Fri"};
                lv_label_set_text(id(wc_bin_day_1), days[dow]);
              }
            } else {
              ESP_LOGW("wc_general", "Date validation failed");
              lv_label_set_text(id(wc_bin_icon_1), "");
              lv_label_set_text(id(wc_bin_date_1), "");
              lv_label_set_text(id(wc_bin_day_1), "");
            }

