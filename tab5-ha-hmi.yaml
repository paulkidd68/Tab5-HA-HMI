#---------------------------------
# GLOBALS
#---------------------------------

globals:
  - id: page_num
    type: int
    restore_value: no
    initial_value: '0'
  - id: lvgl_ready
    type: bool
    restore_value: no
    initial_value: 'false'    
  - id: light_r
    type: uint8_t
    restore_value: no
    initial_value: '0xFF'
  - id: light_g
    type: uint8_t
    restore_value: no
    initial_value: '0xFF'
  - id: light_b
    type: uint8_t
    restore_value: no
    initial_value: '0xFF'
  - id: hvac_state_table
    type: const char *[6]
    initial_value: '{ "heat", "idle", "off" }'
  - id: fan_modes_table
    type: const char *[4]
    initial_value: '{ "auto" }'
  - id: image_buffer
    type: uint8_t*
    restore_value: no
    initial_value: 'nullptr'
  - id: album_art_buffer
    type: uint8_t*
    restore_value: no
    initial_value: 'nullptr'
  - id: album_art_obj
    type: lv_obj_t*
    restore_value: no
    initial_value: 'nullptr'    
  - id: selected_climate
    type: int
    restore_value: no
    initial_value: '0'  # 0 = Workshop, 1 = Afterburner2


#-------------------------------
# NUMBER used for screen timout
#-------------------------------

number:
  - platform: template
    name: LVGL Screen timeout
    optimistic: true
    id: display_timeout
    unit_of_measurement: "s"
    initial_value: 45
    restore_value: true
    min_value: 10
    max_value: 180
    step: 5
    mode: box

text:
#  - platform: lvgl
#    name: fr_cond_icon
#    widget: lbl_weather_forecast_condition_icon
#    mode: text
  - platform: lvgl
    name: fr_cond_name
    widget: lbl_fc_condition_name
    mode: text


