lvgl:
  rotation: 270°
  on_boot:
    - rx8130.read_time:
    - lvgl.label.update:
        id: splash_status_label
        text: "Loading UI..."      
    - script.execute: expand_nav_btn_click_area    # Expand the click area of nav rail buttons
    - script.execute: nav_rail_update              # Update rail UI
    - lvgl.label.update:
        id: splash_status_label
        text: "Connecting..."    
    - script.execute: sync_ha                      # Sync Home Assistant states if necessary
    - lambda: 'id(lvgl_ready) = true;'
    - delay: 100ms
    - script.execute: refresh_dashboard_labels     # Refresh fuel status after LVGL is ready
    - lvgl.label.update:
        id: splash_status_label
        text: "Ready!"
    - delay: 1000ms
    # Hide splash overlay
    - lvgl.widget.hide: splash_overlay
  byte_order: little_endian
  style_definitions:
