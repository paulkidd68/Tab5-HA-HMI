  # Afterburner2 fuel status
  - platform: homeassistant
    id: fuel_status
    entity_id: sensor.afterburner_afterburner2_fuel_status
    internal: true
    on_value:
      then:
        - logger.log:
            format: "Fuel status received: '%s'"
            args: ['x.c_str()']
        - lambda: |-
            if (!id(lvgl_ready)) {
              return;
            }
            if (x.find("EMPTY") != std::string::npos || x.find("2:") != std::string::npos) {
              lv_label_set_text(id(fuel_icon_label), "\U000F0026");
              lv_obj_set_style_text_color(id(fuel_icon_label), lv_color_hex(0xFF0000), 0);
              lv_label_set_text(id(fuel_text_label), "Fuel EMPTY");
              lv_obj_set_style_text_color(id(fuel_text_label), lv_color_hex(0xFF0000), 0);
              lv_obj_clear_flag(id(fuel_icon_label), LV_OBJ_FLAG_HIDDEN);
              lv_obj_clear_flag(id(fuel_text_label), LV_OBJ_FLAG_HIDDEN);
