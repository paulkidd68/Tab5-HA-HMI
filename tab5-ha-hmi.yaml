                    - homeassistant.service:
                        service: media_player.media_next_track
                        data:
                          entity_id: ${entity_media_player}
              # Power Button
              - button:
                  id: media_power_btn
                  width: 80
                  height: 80
                  radius: 40
                  bg_color: 0xFF9999
                  align: BOTTOM_MID
                  x: 150
                  y: -30
                  widgets:
                    - label:
                        text: "\U000F0425"
                        text_font: extra_icon
                        text_color: 0x000000
                        align: CENTER
                  on_press:
                    - if:
                        condition:
                          lambda: |-
                            const std::string state = id(media_player_state).state;
                            return state == "off" || state == "standby" || state == "unavailable";
                        then:
                          - homeassistant.service:
                              service: media_player.turn_on
                              data:
                                entity_id: ${entity_media_player}
                        else:
                          - homeassistant.service:
                              service: media_player.turn_off
                              data:
                                entity_id: ${entity_media_player}
