alias: Thermostat Schedule - Night Mode
description: Set thermostat to night temperature at scheduled time (with catch-up on HA start)
trigger:
  - platform: time
    at: input_datetime.night_start_time
  - platform: homeassistant
    event: start
condition:
  - condition: state
    entity_id: input_boolean.thermostat_schedule_enabled
    state: 'on'
  - condition: template
    value_template: >-
      {%- set now_dt = now() -%}
      {%- set night_s = states('input_datetime.night_start_time') -%}
      {%- if not night_s or night_s in ['unknown','none'] -%}
        false
      {%- else -%}
        {%- set night_dt = as_datetime(night_s) -%}
        {%- set day_s = states('input_datetime.day_start_time') -%}
        {%- if day_s and day_s not in ['unknown','none',''] -%}
          {%- set day_dt = as_datetime(day_s) -%}
        {%- else -%}
          {%- set day_dt = night_dt + timedelta(hours=10) -%}
        {%- endif -%}
        {%- if day_dt <= night_dt -%}
          {%- set day_dt = day_dt + timedelta(days=1) -%}
        {%- endif -%}
        {{ now_dt >= night_dt and now_dt < day_dt }}
      {%- endif -%}
action:
  - service: climate.set_temperature
    target:
      entity_id: climate.tab5_hmi_workshop_thermostat
    data:
      temperature: "{{ states('input_number.night_temperature') | float }}"