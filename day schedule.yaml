id: thermostat_schedule_day_mode
alias: Thermostat Schedule - Day Mode
description: >-
  Set thermostat to day temperature at scheduled time (with catch-up on HA
  start)
triggers:
  - at: input_datetime.day_start_time
    trigger: time
conditions:
  - condition: state
    entity_id: input_boolean.thermostat_schedule_enabled
    state: "on"
  - condition: template
    value_template: >-
      {%- set now_dt = now() -%} {%- set day_s =
      states('input_datetime.day_start_time') -%} {%- if not day_s or day_s in
      ['unknown','none'] -%}
        false
      {%- else -%}
        {%- set day_dt = as_datetime(day_s) -%}
        {%- set eve_s = states('input_datetime.evening_time') -%}
        {%- if eve_s and eve_s not in ['unknown','none',''] -%}
          {%- set eve_dt = as_datetime(eve_s) -%}
        {%- else -%}
          {%- set eve_dt = day_dt + timedelta(hours=12) -%}
        {%- endif -%}
        {{ now_dt >= day_dt and now_dt < eve_dt }}
      {%- endif -%}
actions:
  - target:
      entity_id: climate.tab5_hmi_workshop_thermostat
    data:
      temperature: "{{ states('input_number.day_temperature') | float }}"
    action: climate.set_temperature
mode: single
